{{- if and (eq .Values.mode "cluster") .Values.hooks.credentials }}
{{- $bindings := list }}
{{- $names := dict }}
{{- range .Values.hooks.credentials }}
{{- if hasKey $names .name }}{{ fail "hook credential binding names must be unique" }}{{ end }}
{{- $_ := set $names .name true }}
{{- $bindings = append $bindings (dict "name" .name "origin" .origin "namespace" .namespace "resourceNames" .resourceNames) }}
{{- end }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ .Chart.Name }}-hook-auth
  namespace: {{ .Release.Namespace | quote }}
data:
  bindings.json: {{ $bindings | toJson | quote }}
{{- end }}
