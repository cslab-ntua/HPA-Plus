<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>HPA+</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%232a78d6'/%3E%3Cpath d='M7 22l6-7 5 4 7-9' stroke='white' stroke-width='3' fill='none' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E">
<link rel="stylesheet" href="app.css">
</head>
<body>
<header class="bar">
  <div class="bar-inner">
    <a class="brand" href="#/" aria-label="HPA+ overview">
      <svg viewBox="0 0 32 32" aria-hidden="true"><rect width="32" height="32" rx="8"/><path d="M7 22l6-7 5 4 7-9"/></svg>
      <span>HPA+</span>
    </a>
    <label class="field"><span class="sr">Namespace</span>
      <select id="namespace" aria-label="Namespace"><option value="">All namespaces</option></select>
    </label>
    <span class="live" id="live"><span class="dot"></span><span id="live-text" role="status" aria-live="polite">Connecting…</span><span id="live-time"></span></span>
    <div class="seg" id="theme" role="group" aria-label="Theme">
      <button type="button" data-theme-choice="auto" aria-pressed="true">Auto</button>
      <button type="button" data-theme-choice="light" aria-pressed="false">Light</button>
      <button type="button" data-theme-choice="dark" aria-pressed="false">Dark</button>
    </div>
  </div>
</header>
<main class="page" id="app" tabindex="-1">
  <p class="muted">Loading your autoscalers…</p>
</main>
<script src="charts.js"></script>
<script src="app.js"></script>
</body>
</html>
