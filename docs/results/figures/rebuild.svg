<rect x="0.5" y="0.5" width="999" height="573" rx="6" class="card"/>
<text x="24.0" y="44.0" class="ink display" font-size="20">What saturated pods hide</text>
<text x="24.0" y="68.0" class="muted" font-size="13.5">The HPA formula setup at the same third peak. Its 1 to 2 pods could not keep up, so requests piled up: more started than</text>
<text x="24.0" y="87.0" class="muted" font-size="13.5">finished. Its measured CPU stopped at what those pods could do. The rebuild, measured CPU × requests started ÷</text>
<text x="24.0" y="106.0" class="muted" font-size="13.5">requests finished, follows the CPU the requests needed.</text>
