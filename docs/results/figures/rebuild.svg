<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="574" viewBox="0 0 1000 574" role="img" aria-labelledby="title desc">
<title id="title">What saturated pods hide</title>
<desc id="desc">At the third peak the HPA formula setup had 1 to 2 pods. About 72 to 76 requests per second started but only 21 to 50 finished. Its measured CPU stayed at 1.0 to 2.0 cores, while the same requests needed 2.4 to 2.6 cores. The rebuild, measured CPU times started over finished, gave 2.9 to 3.5 cores.</desc>
