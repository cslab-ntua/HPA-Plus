<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="649" viewBox="0 0 1000 649" role="img" aria-labelledby="title desc">
<title id="title">One peak up close</title>
<desc id="desc">At the third peak HPA+ request demand had 5 pods ready as the peak started and answered almost every request within 500 ms. The CPU forecast had 2 pods at the start and answered 53% in time during the first 15 seconds. The reactive formula stayed at 1 to 2 pods and answered 2 to 7% in time.</desc>
