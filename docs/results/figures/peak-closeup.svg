<text x="24.0" y="68.0" class="muted" font-size="13.5">The third of the 12 peaks in the measured hour. The others looked the same: HPA+ request demand had 5 pods</text>
<text x="24.0" y="87.0" class="muted" font-size="13.5">ready as each of the 12 peaks started, the CPU forecast at 5 of them and the reactive formula at none.</text>
