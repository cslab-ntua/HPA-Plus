<title id="title">The 16:00 kick-off up close</title>
<desc id="desc">The 16:00 kick-off of the World Cup run up close. HPA+ had a second pod from 16:08 and missed 20 requests here. The HPA formula added its second pod at 16:14, once its one pod was full, and missed 351.</desc>
