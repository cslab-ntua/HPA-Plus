<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="475" viewBox="0 0 1000 475" role="img" aria-labelledby="title desc">
<title id="title">Traffic plan and shapes</title>
<desc id="desc">Each 2-hour scenario: 40 minutes of learning traffic, 5 minutes of even start, a measured hour, a 10-minute sudden jump and 5 minutes of recovery. Repeated peaks: 75 seconds at about 75 requests per second every 5 minutes, about 9 between. Cycles: every 10 minutes a climb to about 75 requests per second, 3 minutes at the top with heavier requests for part of it, and a descent. Sudden jump: 68 requests per second of mostly heavy requests for 10 minutes.</desc>
<style>text{font-family:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif}.display{font-family:"IBM Plex Sans Condensed","Arial Narrow",system-ui,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;font-weight:600}.mono{font-family:"IBM Plex Mono",ui-monospace,"SF Mono",Menlo,Consolas,"DejaVu Sans Mono","Liberation Mono",monospace;font-variant-numeric:tabular-nums}.line{fill:none;stroke-linejoin:round;stroke-linecap:round}.hair{fill:none;stroke-width:1}.plane{fill:#f4f4f1}.card{fill:#fcfcfb;stroke:rgba(11,11,11,0.12)}.grid{stroke:#e1e0d9}.axis{stroke:#c3c2b7}.band{fill:rgba(42,120,214,0.07)}.ink{fill:#0b0b0b}.ink2{fill:#52514e}.muted{fill:#7d7b75}.l-cand{stroke:#2a78d6}.l-cpu{stroke:#eb6834}.l-react{stroke:#1baf7a}.l-load{stroke:#52514e}.f-load{fill:rgba(82,81,78,0.12)}.f-heavy{fill:rgba(82,81,78,0.36)}.f-seg{fill:#e1e0d9}.f-jump{fill:rgba(42,120,214,0.20)}.f-wcand{fill:rgba(42,120,214,0.30)}.f-wcpu{fill:rgba(235,104,52,0.30)}.f-wreact{fill:rgba(27,175,122,0.32)}.l-req{stroke:#0b0b0b}.f-cand{fill:#2a78d6}.f-cpu{fill:#eb6834}.f-react{fill:#1baf7a}.ring{stroke:#fcfcfb}.marker{stroke:#52514e}@media (prefers-color-scheme:dark){.plane{fill:#0f0f0e}.card{fill:#1a1a19;stroke:rgba(255,255,255,0.12)}.grid{stroke:#2c2c2a}.axis{stroke:#44443f}.band{fill:rgba(57,135,229,0.10)}.ink{fill:#f0efec}.ink2{fill:#c3c2b7}.muted{fill:#94928b}.l-cand{stroke:#3987e5}.l-cpu{stroke:#d95926}.l-react{stroke:#199e70}.l-load{stroke:#c3c2b7}.f-load{fill:rgba(195,194,183,0.12)}.f-heavy{fill:rgba(195,194,183,0.34)}.f-seg{fill:#2c2c2a}.f-jump{fill:rgba(57,135,229,0.28)}.f-wcand{fill:rgba(57,135,229,0.36)}.f-wcpu{fill:rgba(217,89,38,0.36)}.f-wreact{fill:rgba(25,158,112,0.40)}.l-req{stroke:#f0efec}.f-cand{fill:#3987e5}.f-cpu{fill:#d95926}.f-react{fill:#199e70}.ring{stroke:#1a1a19}.marker{stroke:#c3c2b7}}</style>
<rect x="0.5" y="0.5" width="999" height="474" rx="6" class="card"/>
<text x="24.0" y="44.0" class="ink display" font-size="20">Traffic plan and shapes</text>
<text x="24.0" y="68.0" class="muted" font-size="13.5">The 4-hour run was two 2-hour scenarios, one with repeated peaks and one with cycles. Each setup received its own</text>
<text x="24.0" y="87.0" class="muted" font-size="13.5">copy of the same requests. Both scenarios followed the same plan and ended with the same sudden jump.</text>
