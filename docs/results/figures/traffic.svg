<text x="236.8" y="121.0" class="ink2" font-size="13">Heavier requests: more checkouts, which cost 3 times a browse</text>
<text x="24.0" y="159.0" class="ink2" font-size="13" font-weight="600">Each 2-hour scenario</text>
